name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest uvicorn fastapi pydantic
      - name: Run Python Main Pipeline
        run: python code/main.py
      - name: Run Synthetic Unseen Tests
        run: python tests_v2/unseen_cases.py
      - name: Run Unit Tests
        run: pytest code/test_ledger_fixes.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install
      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
